name = "GHHSBridge"
version = "1.0.0"
defaultTargets = ["BridgeSolution"]

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "LatinonEntropy"
git = "https://github.com/jtraverso/latinon-entropy-ldp-lean"
rev = "023123b8842148e3a8fb54fcb729e7998b6926d7"

[[lean_lib]]
name = "GHHSBridge"
roots = ["GHHSBridge"]
globs = ["GHHSBridge.+"]

[[lean_lib]]
name = "BridgeChallenge"
roots = ["BridgeChallenge"]

[[lean_lib]]
name = "BridgeSolution"
roots = ["BridgeSolution"]
